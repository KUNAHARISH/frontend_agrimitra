# fly.toml app configuration file for AgriMitra AI Backend (Fly.io Mumbai BOM Region)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "agrimitra-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  OMP_NUM_THREADS = "1"
  MKL_NUM_THREADS = "1"
  OPENBLAS_NUM_THREADS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
